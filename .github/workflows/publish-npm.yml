name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0-rc.2). Must match a git tag if release trigger is unused."
        required: true
      dist-tag:
        description: "npm dist-tag. 'auto' derives 'rc' from prerelease versions, 'latest' otherwise."
        required: true
        default: "auto"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 预留：未来可启用 npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Determine version and dist-tag
        id: release-info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：version 来自输入框，dist-tag 可显式指定或 auto
            VERSION="${{ inputs.version }}"
            if [ "${{ inputs.dist-tag }}" = "auto" ]; then
              if [[ "$VERSION" == *-* ]]; then TAG="rc"; else TAG="latest"; fi
            else
              TAG="${{ inputs.dist-tag }}"
            fi
            echo "Manual trigger: version=$VERSION, tag=$TAG"
          else
            # Release 触发：从 release tag_name 解析版本（去掉前导 'v'）
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION="${TAG_NAME#v}"
            if [[ "$VERSION" == *-* ]]; then TAG="rc"; else TAG="latest"; fi
            echo "Release trigger: tag_name=$TAG_NAME → version=$VERSION, dist-tag=$TAG"
          fi

          # 基本格式校验
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Sync version to all package.json files
        env:
          VERSION: ${{ steps.release-info.outputs.version }}
        run: |
          echo "Setting version=$VERSION across all @rtc-agent/* packages"
          node -e "
            const fs = require('fs');
            const path = require('path');
            const root = process.cwd();
            const pkgsDir = path.join(root, 'packages');
            const version = process.env.VERSION;
            for (const dir of fs.readdirSync(pkgsDir)) {
              const pkgPath = path.join(pkgsDir, dir, 'package.json');
              if (!fs.existsSync(pkgPath)) continue;
              const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              if (!pkg.name || !pkg.name.startsWith('@rtc-agent/')) continue;
              const prev = pkg.version;
              pkg.version = version;
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
              console.log('  ' + pkg.name + ': ' + prev + ' → ' + version);
            }
          "

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${{ steps.release-info.outputs.tag }}"
          VERSION="${{ steps.release-info.outputs.version }}"
          echo "Publishing @rtc-agent/*@ $VERSION with dist-tag: $TAG"
          # 按依赖顺序发布：protocol → client → persistence → worker → component
          # pnpm 会自动把 workspace:* 重写为实际版本号
          pnpm --filter @rtc-agent/protocol    publish --access public --tag "$TAG" --no-git-checks
          pnpm --filter @rtc-agent/client      publish --access public --tag "$TAG" --no-git-checks
          pnpm --filter @rtc-agent/persistence publish --access public --tag "$TAG" --no-git-checks
          pnpm --filter @rtc-agent/worker      publish --access public --tag "$TAG" --no-git-checks
          pnpm --filter @rtc-agent/component   publish --access public --tag "$TAG" --no-git-checks
