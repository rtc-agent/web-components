name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 预留：未来可启用 npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 按依赖顺序发布：protocol → client → persistence → component
          # pnpm 会自动把 workspace:* 重写为实际版本号
          pnpm --filter @rtc-agent/protocol    publish --access public --no-git-checks
          pnpm --filter @rtc-agent/client      publish --access public --no-git-checks
          pnpm --filter @rtc-agent/persistence publish --access public --no-git-checks
          pnpm --filter @rtc-agent/component   publish --access public --no-git-checks
