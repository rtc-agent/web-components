<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Bar Debug - Phase 2.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #404040;
            color: #cccccc;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        h2 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .debug-panel {
            background: #252526;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .debug-section {
            margin-bottom: 16px;
        }

        .debug-section:last-child {
            margin-bottom: 0;
        }

        /* Theme buttons */
        .theme-buttons {
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .theme-btn:hover {
            background: #4a4a4a;
        }

        .theme-btn.active {
            background: #007acc;
            color: white;
        }

        /* State display */
        .state-display {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            color: #4ec9b0;
            overflow-x: auto;
        }

        /* Control buttons */
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-btn {
            padding: 6px 12px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #4a4a4a;
        }

        .control-btn.primary {
            background: #0e639c;
        }

        .control-btn.primary:hover {
            background: #1177bb;
        }

        /* Event log */
        .event-log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            color: #d4d4d4;
        }

        .event-log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #2d2d30;
        }

        .event-log-entry:last-child {
            border-bottom: none;
        }

        .event-log-entry .event-name {
            color: #dcdcaa;
        }

        .event-log-entry .event-detail {
            color: #ce9178;
        }

        .event-log-empty {
            color: #666;
            font-style: italic;
        }

        /* Preview area */
        .preview-area {
            display: flex;
            background: #252526;
            border-radius: 8px;
            overflow: hidden;
            min-height: 400px;
        }

        /* Simulated sidebar */
        .sidebar {
            width: 240px;
            background: #252526;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            transition: width 0.2s, opacity 0.2s;
        }

        .sidebar.hidden {
            width: 0;
            opacity: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 12px 16px;
            background: #2d2d30;
            border-bottom: 1px solid #1a1a1a;
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }

        .sidebar-content {
            flex: 1;
            padding: 16px;
            color: #666;
            font-size: 13px;
        }

        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }

        /* Theme-specific styles (applied to preview container) */
        .preview-container {
            display: flex;
            width: 100%;
        }

        .preview-container[theme="light"] {
            --rtc-color-primary: #007acc;
            --rtc-color-text: #333333;
            --rtc-color-text-secondary: #666666;
            --rtc-color-text-tertiary: #999999;
            --rtc-color-text-inverse: #ffffff;
            --rtc-color-bg: #ffffff;
            --rtc-color-bg-secondary: #f5f5f5;
            --rtc-color-bg-tertiary: #e8e8e8;
            --rtc-color-bg-hover: #f0f0f0;
            --rtc-color-bg-active: #e0e0e0;
            --rtc-color-border: #e0e0e0;
            --rtc-color-border-focus: #007acc;
        }

        .preview-container[theme="dark"] {
            --rtc-color-primary: #007acc;
            --rtc-color-text: #cccccc;
            --rtc-color-text-secondary: #858585;
            --rtc-color-text-tertiary: #666666;
            --rtc-color-text-inverse: #1e1e1e;
            --rtc-color-bg: #1e1e1e;
            --rtc-color-bg-secondary: #252526;
            --rtc-color-bg-tertiary: #2d2d30;
            --rtc-color-bg-hover: #2a2d2e;
            --rtc-color-bg-active: #37373d;
            --rtc-color-border: #3c3c3c;
            --rtc-color-border-focus: #007acc;
        }

        /* Light theme overrides for preview */
        .preview-container[theme="light"] .sidebar {
            background: #f5f5f5;
            border-right-color: #e0e0e0;
        }

        .preview-container[theme="light"] .sidebar-header {
            background: #e8e8e8;
            border-bottom-color: #e0e0e0;
            color: #666;
        }

        .preview-container[theme="light"] .sidebar-content {
            color: #999;
        }

        .preview-container[theme="light"] .main-content {
            color: #999;
        }

        /* Current theme indicator */
        .current-theme {
            display: inline-block;
            padding: 4px 8px;
            background: #3a3a3a;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <h1>Activity Bar Debug - Phase 2.1</h1>

    <!-- Debug Panel -->
    <div class="debug-panel">
        <!-- Theme Section -->
        <div class="debug-section">
            <h2>主题 <span class="current-theme" id="currentTheme">dark</span></h2>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="light">Light</button>
                <button class="theme-btn active" data-theme="dark">Dark</button>
                <button class="theme-btn" data-theme="system">System</button>
            </div>
        </div>

        <!-- State Section -->
        <div class="debug-section">
            <h2>状态</h2>
            <div class="state-display" id="stateDisplay">
                {"active":"chat","sidebarVisible":false}
            </div>
        </div>

        <!-- Activity Controls -->
        <div class="debug-section">
            <h2>活动切换</h2>
            <div class="control-group">
                <button class="control-btn" data-activity="files">Files</button>
                <button class="control-btn primary" data-activity="chat">Chat</button>
                <button class="control-btn" data-activity="settings">Settings</button>
            </div>
        </div>

        <!-- Sidebar Controls -->
        <div class="debug-section">
            <h2>Sidebar 控制</h2>
            <div class="control-group">
                <button class="control-btn" id="showSidebar">Show</button>
                <button class="control-btn" id="hideSidebar">Hide</button>
                <button class="control-btn" id="toggleSidebar">Toggle</button>
            </div>
        </div>

        <!-- Reset -->
        <div class="debug-section">
            <div class="control-group">
                <button class="control-btn" id="resetBtn">Reset</button>
                <button class="control-btn" id="clearLog">Clear Log</button>
            </div>
        </div>

        <!-- Event Log -->
        <div class="debug-section">
            <h2>事件日志</h2>
            <div class="event-log" id="eventLog">
                <div class="event-log-empty">暂无事件</div>
            </div>
        </div>
    </div>

    <!-- Preview Area -->
    <h2>组件预览</h2>
    <div class="preview-area">
        <div class="preview-container" id="previewContainer" theme="dark">
            <!-- Activity Bar will be inserted here -->
            <!-- Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">资源管理器</div>
                <div class="sidebar-content">
                    （这里是文件树）
                </div>
            </div>
            <!-- Main content -->
            <div class="main-content">
                主内容区域
            </div>
        </div>
    </div>

    <script type="module">
        // Import styles (for tokens)
        import {tokens} from '../src/styles/tokens.ts';
        import {lightTheme} from '../src/styles/themes/light.ts';
        import {darkTheme} from '../src/styles/themes/dark.ts';

        // Import component
        import '../src/components/activity-bar/rtc-activity-bar.ts';

        // State management
        const state = {
            active: 'chat',
            sidebarVisible: false,
        };

        // DOM elements
        const stateDisplay = document.getElementById('stateDisplay');
        const eventLog = document.getElementById('eventLog');
        const previewContainer = document.getElementById('previewContainer');
        const sidebar = document.getElementById('sidebar');
        const currentThemeEl = document.getElementById('currentTheme');

        // Create and insert activity bar
        const activityBar = document.createElement('rtc-activity-bar');
        previewContainer.insertBefore(activityBar, previewContainer.firstChild);

        // Update state display
        function updateStateDisplay() {
            stateDisplay.textContent = JSON.stringify(state, null, 2);
            activityBar.active = state.active;
            sidebar.classList.toggle('hidden', !state.sidebarVisible);
        }

        // Log event
        function logEvent(name, detail) {
            const entry = document.createElement('div');
            entry.className = 'event-log-entry';
            entry.innerHTML = `<span class="event-name">${name}</span> <span class="event-detail">${JSON.stringify(detail)}</span>`;

            // Remove empty placeholder
            const empty = eventLog.querySelector('.event-log-empty');
            if (empty) empty.remove();

            // Add to top
            eventLog.insertBefore(entry, eventLog.firstChild);

            // Keep only last 20 entries
            while (eventLog.children.length > 20) {
                eventLog.removeChild(eventLog.lastChild);
            }
        }

        // Activity change handler
        activityBar.addEventListener('activity-change', (e) => {
            const {activity, toggleSidebar} = e.detail;
            logEvent('activity-change', e.detail);

            if (toggleSidebar) {
                // Toggle sidebar
                state.sidebarVisible = !state.sidebarVisible;
            } else {
                // Switch activity
                state.active = activity;
                state.sidebarVisible = true;
            }

            updateStateDisplay();
            updateActivityButtons();
        });

        // Theme buttons
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThemeEl.textContent = theme;

                // Apply theme to preview container
                if (theme === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    previewContainer.setAttribute('theme', prefersDark ? 'dark' : 'light');
                } else {
                    previewContainer.setAttribute('theme', theme);
                }
            });
        });

        // Activity buttons
        function updateActivityButtons() {
            document.querySelectorAll('[data-activity]').forEach(btn => {
                btn.classList.toggle('primary', btn.dataset.activity === state.active);
            });
        }

        document.querySelectorAll('[data-activity]').forEach(btn => {
            btn.addEventListener('click', () => {
                const activity = btn.dataset.activity;
                // Simulate clicking the activity bar icon
                activityBar.dispatchEvent(new CustomEvent('activity-change', {
                    detail: {
                        activity,
                        toggleSidebar: activity === state.active,
                    }
                }));
            });
        });

        // Sidebar controls
        document.getElementById('showSidebar').addEventListener('click', () => {
            state.sidebarVisible = true;
            updateStateDisplay();
            logEvent('showSidebar', {});
        });

        document.getElementById('hideSidebar').addEventListener('click', () => {
            state.sidebarVisible = false;
            updateStateDisplay();
            logEvent('hideSidebar', {});
        });

        document.getElementById('toggleSidebar').addEventListener('click', () => {
            state.sidebarVisible = !state.sidebarVisible;
            updateStateDisplay();
            logEvent('toggleSidebar', {sidebarVisible: state.sidebarVisible});
        });

        // Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            state.active = 'chat';
            state.sidebarVisible = false;
            updateStateDisplay();
            updateActivityButtons();
            logEvent('reset', {});
        });

        // Clear log
        document.getElementById('clearLog').addEventListener('click', () => {
            eventLog.innerHTML = '<div class="event-log-empty">暂无事件</div>';
        });

        // Initial state
        updateStateDisplay();
        updateActivityButtons();
    </script>
</body>
</html>
