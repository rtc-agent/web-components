<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Layout Debug - Step 6</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #404040;
            color: #cccccc;
            padding: 20px;
            min-height: 100vh;
        }

        h1 { font-size: 20px; margin-bottom: 20px; color: #ffffff; }
        h2 { font-size: 14px; margin-bottom: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }

        .debug-panel {
            background: #252526;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .debug-section { margin-bottom: 16px; }
        .debug-section:last-child { margin-bottom: 0; }

        .theme-buttons, .control-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }

        .theme-btn, .control-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .theme-btn:hover, .control-btn:hover { background: #4a4a4a; }
        .theme-btn.active { background: #007acc; color: white; }
        .control-btn.primary { background: #0e639c; }
        .control-btn.primary:hover { background: #1177bb; }

        .event-log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            color: #d4d4d4;
        }

        .event-log-entry { padding: 4px 0; border-bottom: 1px solid #2d2d30; }
        .event-log-entry:last-child { border-bottom: none; }
        .event-log-entry .event-name { color: #dcdcaa; }
        .event-log-entry .event-detail { color: #ce9178; }
        .event-log-empty { color: #666; font-style: italic; }

        .preview-area {
            background: #252526;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-container {
            display: flex;
            height: 500px;
            transition: background-color 0.2s, color 0.2s;
        }

        .preview-container[theme="dark"] { background: #252526; color: #cccccc; }
        .preview-container[theme="light"] { background: #ffffff; color: #333333; }

        .state-display {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            color: #4ec9b0;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Chat Layout Debug (Step 6)</h1>

    <div class="debug-panel">
        <div class="debug-section">
            <h2>主题 (当前: <span id="currentTheme">dark</span>)</h2>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="light">Light</button>
                <button class="theme-btn active" data-theme="dark">Dark</button>
                <button class="theme-btn" data-theme="system">System</button>
            </div>
        </div>

        <div class="debug-section">
            <h2>Controller 控制</h2>
            <div class="control-group">
                <button class="control-btn primary" id="expandAll">展开所有</button>
                <button class="control-btn" id="collapseAll">折叠所有</button>
            </div>
            <div class="control-group">
                <button class="control-btn primary" id="selectRoot1">选中 Session 1</button>
                <button class="control-btn" id="selectRoot2">选中 Session 2</button>
                <button class="control-btn" id="selectChild21">选中 Child 2.1</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="addSession">添加新 Session</button>
                <button class="control-btn" id="addChildSession">添加子 Session</button>
                <button class="control-btn" id="reloadMock">重新加载 Mock</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="resetBtn">Reset</button>
                <button class="control-btn" id="clearLog">Clear Log</button>
            </div>
        </div>

        <div class="debug-section">
            <h2>事件日志</h2>
            <div class="event-log" id="eventLog">
                <div class="event-log-empty">暂无事件</div>
            </div>
        </div>

        <div class="debug-section">
            <h2>状态</h2>
            <div class="state-display" id="stateDisplay">{ tabs: [], activeSessionId: null, currentSessionId: null }</div>
        </div>
    </div>

    <h2>组件预览</h2>
    <div class="preview-area">
        <div class="preview-container" id="previewContainer" theme="dark">
            <rtc-chat-layout id="chatLayout" theme="dark"></rtc-chat-layout>
        </div>
    </div>

    <script type="module">
        import '../src/components/chat-layout/rtc-chat-layout.ts';
        import {SessionTreeController} from '../src/controllers/session-tree.controller.ts';
        import {SessionTabController} from '../src/controllers/session-tab.controller.ts';
        import {SessionTreeContext} from '../src/contexts/session-tree.ts';
        import {SessionTabContext} from '../src/contexts/session-tab.ts';
        import {SessionContext} from '../src/contexts/session.ts';
        import {ContextProvider} from '@lit/context';

        const previewContainer = document.getElementById('previewContainer');

        // Simple hosts
        const treeHost = {
            _updateCallbacks: [],
            addController(c) { c.hostConnected?.(); },
            requestUpdate() { this._updateCallbacks.forEach(cb => cb()); },
            onUpdate(cb) { this._updateCallbacks.push(cb); },
            dispatchEvent() {},
        };

        const tabHost = {
            _updateCallbacks: [],
            addController(c) { c.hostConnected?.(); },
            requestUpdate() { this._updateCallbacks.forEach(cb => cb()); },
            onUpdate(cb) { this._updateCallbacks.push(cb); },
            dispatchEvent() {},
        };

        const sessionHost = {
            _updateCallbacks: [],
            addController(c) { c.hostConnected?.(); },
            requestUpdate() { this._updateCallbacks.forEach(cb => cb()); },
            onUpdate(cb) { this._updateCallbacks.push(cb); },
            dispatchEvent() {},
        };

        const treeController = new SessionTreeController(treeHost);
        const tabController = new SessionTabController(tabHost);

        // Session state
        let mockSessions = [];
        let currentSessionId = null;
        let currentTheme = 'dark';

        function createSessionActions() {
            return {
                createSession: () => {
                    const id = `root-${Date.now()}`;
                    mockSessions.push({
                        clientId: id,
                        title: 'New Session',
                        createdAt: Date.now(),
                        updatedAt: Date.now(),
                    });
                    treeController.actions.rebuildTree(mockSessions);
                    sessionHost.requestUpdate();
                    logEvent('session.createSession', {id});
                },
                switchSession: (id) => {
                    currentSessionId = id;
                    sessionHost.requestUpdate();
                    logEvent('session.switchSession', {id});
                },
                renameSession: (id, title) => {
                    const s = mockSessions.find(s => s.clientId === id);
                    if (s) s.title = title;
                    treeController.actions.rebuildTree(mockSessions);
                    sessionHost.requestUpdate();
                },
                deleteSession: (id) => {
                    mockSessions = mockSessions.filter(s => s.clientId !== id);
                    if (currentSessionId === id) currentSessionId = null;
                    treeController.actions.rebuildTree(mockSessions);
                    sessionHost.requestUpdate();
                },
                reset: () => { currentSessionId = null; },
                clearCurrentSession: () => { currentSessionId = null; },
                setCurrentSession: (s) => { currentSessionId = s.clientId; },
                setSessions: (sessions) => {
                    mockSessions = sessions;
                    treeController.actions.rebuildTree(mockSessions);
                },
            };
        }

        const sessionActions = createSessionActions();

        // Context providers
        class SessionTreeProvider extends HTMLElement {
            constructor() {
                super();
                this._provider = new ContextProvider(this, {
                    context: SessionTreeContext,
                    initialValue: treeController.value,
                });
            }
            updateValue() { this._provider.setValue(treeController.value); }
        }
        customElements.define('session-tree-provider', SessionTreeProvider);

        class SessionTabProvider extends HTMLElement {
            constructor() {
                super();
                this._provider = new ContextProvider(this, {
                    context: SessionTabContext,
                    initialValue: tabController.value,
                });
            }
            updateValue() { this._provider.setValue(tabController.value); }
        }
        customElements.define('session-tab-provider', SessionTabProvider);

        class SessionProvider extends HTMLElement {
            constructor() {
                super();
                this._provider = new ContextProvider(this, {
                    context: SessionContext,
                    initialValue: {
                        state: { sessions: mockSessions, currentSessionId },
                        actions: sessionActions,
                    },
                });
            }
            updateValue() {
                this._provider.setValue({
                    state: { sessions: mockSessions, currentSessionId },
                    actions: sessionActions,
                });
            }
        }
        customElements.define('session-provider', SessionProvider);

        // Wrap chat layout in providers
        const chatLayout = document.getElementById('chatLayout');
        const treeProvider = document.createElement('session-tree-provider');
        const tabProvider = document.createElement('session-tab-provider');
        const sessionProvider = document.createElement('session-provider');

        previewContainer.appendChild(treeProvider);
        treeProvider.appendChild(tabProvider);
        tabProvider.appendChild(sessionProvider);
        sessionProvider.appendChild(chatLayout);

        treeProvider.style.cssText = 'display: contents;';
        tabProvider.style.cssText = 'display: contents;';
        sessionProvider.style.cssText = 'display: contents;';

        // Mock data
        const defaultMockSessions = [
            { clientId: 'root-1', title: 'Main Conversation', createdAt: Date.now() - 3600000, updatedAt: Date.now() - 60000 },
            { clientId: 'root-2', title: 'Code Review Session', createdAt: Date.now() - 7200000, updatedAt: Date.now() - 120000 },
            { clientId: 'child-21', title: 'Fork: Fix bug in auth', createdAt: Date.now() - 5400000, updatedAt: Date.now() - 30000, rootClientSessionId: 'root-2' },
            { clientId: 'child-22', title: 'Fork: Add tests', createdAt: Date.now() - 4800000, updatedAt: Date.now() - 15000, rootClientSessionId: 'root-2' },
            { clientId: 'root-3', title: 'Design Discussion', createdAt: Date.now() - 10800000, updatedAt: Date.now() - 180000 },
        ];

        function loadMockData() {
            mockSessions = [...defaultMockSessions];
            treeController.actions.rebuildTree(mockSessions);
            treeController.actions.expand('root-2');
            updateStateDisplay();
        }

        loadMockData();

        function updateProviders() {
            treeProvider.updateValue();
            tabProvider.updateValue();
            sessionProvider.updateValue();
            updateStateDisplay();
        }

        treeHost.onUpdate(() => updateProviders());
        tabHost.onUpdate(() => updateProviders());
        sessionHost.onUpdate(() => updateProviders());

        // Chat layout events
        chatLayout.addEventListener('rtc-chat-layout-session-select', (e) => {
            logEvent('rtc-chat-layout-session-select', e.detail);
        });

        chatLayout.addEventListener('rtc-chat-layout-tab-activate', (e) => {
            logEvent('rtc-chat-layout-tab-activate', e.detail);
        });

        chatLayout.addEventListener('rtc-chat-layout-tab-close', (e) => {
            logEvent('rtc-chat-layout-tab-close', e.detail);
        });

        updateProviders();

        function updateStateDisplay() {
            const stateEl = document.getElementById('stateDisplay');
            stateEl.textContent = JSON.stringify({
                tabs: tabController.value.state.tabs.map(t => ({sessionId: t.sessionId, title: t.title})),
                activeSessionId: tabController.value.state.activeSessionId,
                currentSessionId,
                rootNodes: treeController.value.state.rootNodes.map(n => ({
                    id: n.session.clientId,
                    title: n.session.title,
                    expanded: n.isExpanded,
                    children: n.children.map(c => c.session.clientId),
                })),
            }, null, 2);
        }

        function logEvent(name, detail) {
            const entry = document.createElement('div');
            entry.className = 'event-log-entry';
            entry.innerHTML = `<span class="event-name">${name}</span> <span class="event-detail">${JSON.stringify(detail)}</span>`;
            const empty = document.getElementById('eventLog').querySelector('.event-log-empty');
            if (empty) empty.remove();
            document.getElementById('eventLog').insertBefore(entry, document.getElementById('eventLog').firstChild);
            while (document.getElementById('eventLog').children.length > 20) document.getElementById('eventLog').removeChild(document.getElementById('eventLog').lastChild);
        }

        // Theme buttons
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('currentTheme').textContent = theme;
                let resolvedTheme = theme;
                if (theme === 'system') {
                    resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                currentTheme = resolvedTheme;
                previewContainer.setAttribute('theme', resolvedTheme);
                chatLayout.setAttribute('theme', resolvedTheme);
            });
        });

        // Controls
        document.getElementById('expandAll').addEventListener('click', () => {
            treeController.value.state.rootNodes.forEach(node => treeController.actions.expand(node.session.clientId));
        });

        document.getElementById('collapseAll').addEventListener('click', () => {
            treeController.value.state.rootNodes.forEach(node => treeController.actions.collapse(node.session.clientId));
        });

        document.getElementById('selectRoot1').addEventListener('click', () => {
            chatLayout.dispatchEvent(new CustomEvent('rtc-session-tree-select', {
                bubbles: true, composed: true, detail: {sessionId: 'root-1'}
            }));
        });

        document.getElementById('selectRoot2').addEventListener('click', () => {
            chatLayout.dispatchEvent(new CustomEvent('rtc-session-tree-select', {
                bubbles: true, composed: true, detail: {sessionId: 'root-2'}
            }));
        });

        document.getElementById('selectChild21').addEventListener('click', () => {
            treeController.actions.expand('root-2');
            chatLayout.dispatchEvent(new CustomEvent('rtc-session-tree-select', {
                bubbles: true, composed: true, detail: {sessionId: 'child-21'}
            }));
        });

        document.getElementById('addSession').addEventListener('click', () => {
            sessionActions.createSession();
        });

        document.getElementById('addChildSession').addEventListener('click', () => {
            const id = `child-${Date.now()}`;
            mockSessions.push({
                clientId: id,
                title: `New Child ${id.slice(-4)}`,
                createdAt: Date.now(),
                updatedAt: Date.now(),
                rootClientSessionId: 'root-2',
            });
            treeController.actions.rebuildTree(mockSessions);
            treeController.actions.expand('root-2');
            sessionHost.requestUpdate();
            logEvent('add-child-session', {id});
        });

        document.getElementById('reloadMock').addEventListener('click', () => { loadMockData(); });

        document.getElementById('resetBtn').addEventListener('click', () => {
            currentSessionId = null;
            tabController.actions.clearAll();
            loadMockData();
        });

        document.getElementById('clearLog').addEventListener('click', () => {
            document.getElementById('eventLog').innerHTML = '<div class="event-log-empty">暂无事件</div>';
        });
    </script>
</body>
</html>
