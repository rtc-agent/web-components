<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Toolbar Debug - Phase 2.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #404040;
            color: #cccccc;
            padding: 20px;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        h2 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .phase-label {
            display: inline-block;
            padding: 2px 8px;
            background: #0e639c;
            color: white;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .debug-panel {
            background: #252526;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .debug-section {
            margin-bottom: 16px;
        }

        .debug-section:last-child {
            margin-bottom: 0;
        }

        /* ── Theme buttons ── */
        .theme-buttons {
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .theme-btn:hover {
            background: #4a4a4a;
        }

        .theme-btn.active {
            background: #007acc;
            color: white;
        }

        /* ── State display ── */
        .state-display {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            color: #4ec9b0;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        /* ── Control buttons ── */
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-btn {
            padding: 6px 12px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #4a4a4a;
        }

        .control-btn.primary {
            background: #0e639c;
        }

        .control-btn.primary:hover {
            background: #1177bb;
        }

        .control-btn.toggle-on {
            background: #0e639c;
            color: white;
        }

        /* ── Event log ── */
        .event-log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            color: #d4d4d4;
        }

        .event-log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #2d2d30;
        }

        .event-log-entry:last-child {
            border-bottom: none;
        }

        .event-log-entry .event-name {
            color: #dcdcaa;
        }

        .event-log-entry .event-detail {
            color: #ce9178;
        }

        .event-log-empty {
            color: #666;
            font-style: italic;
        }

        /* ── Preview area ── */
        .preview-area {
            background: #252526;
            border-radius: 8px;
            overflow: hidden;
            min-height: 200px;
        }

        .preview-container {
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s, color 0.2s;
        }

        /* ── Theme adaptation for preview container ── */
        .preview-container[theme="dark"] {
            background: #252526;
            color: #cccccc;
            --rtc-color-primary: #007acc;
            --rtc-color-primary-hover: #1e8adc;
            --rtc-color-text: #cccccc;
            --rtc-color-text-secondary: #858585;
            --rtc-color-text-tertiary: #666666;
            --rtc-color-text-inverse: #1e1e1e;
            --rtc-color-bg: #1e1e1e;
            --rtc-color-bg-secondary: #252526;
            --rtc-color-bg-tertiary: #2d2d30;
            --rtc-color-bg-hover: #2a2d2e;
            --rtc-color-bg-active: #37373d;
            --rtc-color-border: #3c3c3c;
            --rtc-color-border-hover: #4c4c4c;
            --rtc-color-border-focus: #007acc;
            --rtc-color-on-primary: #ffffff;
            --rtc-color-accent: #007acc;
        }

        .preview-container[theme="light"] {
            background: #ffffff;
            color: #333333;
            --rtc-color-primary: #007acc;
            --rtc-color-primary-hover: #005a9e;
            --rtc-color-text: #333333;
            --rtc-color-text-secondary: #666666;
            --rtc-color-text-tertiary: #999999;
            --rtc-color-text-inverse: #ffffff;
            --rtc-color-bg: #ffffff;
            --rtc-color-bg-secondary: #f5f5f5;
            --rtc-color-bg-tertiary: #e8e8e8;
            --rtc-color-bg-hover: #e8e8e8;
            --rtc-color-bg-active: #d4d4d4;
            --rtc-color-border: #e0e0e0;
            --rtc-color-border-hover: #cccccc;
            --rtc-color-border-focus: #007acc;
            --rtc-color-on-primary: #ffffff;
            --rtc-color-accent: #007acc;
        }

        /* ── Mock editor area below toolbar ── */
        .mock-editor-area {
            min-height: 160px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--rtc-color-text-tertiary, #666);
            font-size: 13px;
            font-style: italic;
        }

        /* ── Info rows ── */
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #4ec9b0;
            font-family: 'SF Mono', Monaco, monospace;
        }
    </style>
</head>
<body>
    <h1>Editor Toolbar Debug <span class="phase-label">Phase 2.5</span></h1>

    <div class="debug-panel">
        <!-- Theme -->
        <div class="debug-section">
            <h2>主题 (当前: <span id="currentTheme">dark</span>)</h2>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="light">☀ Light</button>
                <button class="theme-btn active" data-theme="dark">🌙 Dark</button>
                <button class="theme-btn" data-theme="system">💻 System</button>
            </div>
        </div>

        <!-- State Display -->
        <div class="debug-section">
            <h2>当前状态</h2>
            <div class="state-display" id="stateDisplay">
{
  "canSave": false,
  "canUndo": false,
  "canRedo": false,
  "viewMode": "split"
}
            </div>
        </div>

        <!-- Info -->
        <div class="debug-section">
            <h2>信息</h2>
            <div class="info-row">
                <span class="info-label">保存可用:</span>
                <span class="info-value" id="canSaveInfo">false</span>
            </div>
            <div class="info-row">
                <span class="info-label">撤销可用:</span>
                <span class="info-value" id="canUndoInfo">false</span>
            </div>
            <div class="info-row">
                <span class="info-label">重做可用:</span>
                <span class="info-value" id="canRedoInfo">false</span>
            </div>
            <div class="info-row">
                <span class="info-label">视图模式:</span>
                <span class="info-value" id="viewModeInfo">split</span>
            </div>
        </div>

        <!-- State Controls -->
        <div class="debug-section">
            <h2>状态控制</h2>
            <div class="control-group">
                <button class="control-btn toggle-on" id="toggleCanSave">canSave: ON</button>
                <button class="control-btn" id="toggleCanUndo">canUndo: OFF</button>
                <button class="control-btn" id="toggleCanRedo">canRedo: OFF</button>
            </div>
        </div>

        <!-- View Mode Controls -->
        <div class="debug-section">
            <h2>视图模式</h2>
            <div class="control-group">
                <button class="control-btn" data-viewmode="edit">Edit</button>
                <button class="control-btn" data-viewmode="preview">Preview</button>
                <button class="control-btn primary" data-viewmode="split">Split</button>
            </div>
        </div>

        <!-- Event Triggers -->
        <div class="debug-section">
            <h2>模拟事件触发</h2>
            <div class="control-group">
                <button class="control-btn" id="triggerSave">Trigger Save</button>
                <button class="control-btn" id="triggerUndo">Trigger Undo</button>
                <button class="control-btn" id="triggerRedo">Trigger Redo</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="triggerBold">Format: Bold</button>
                <button class="control-btn" id="triggerItalic">Format: Italic</button>
                <button class="control-btn" id="triggerCode">Format: Code</button>
                <button class="control-btn" id="triggerLink">Format: Link</button>
            </div>
        </div>

        <!-- Reset -->
        <div class="debug-section">
            <div class="control-group">
                <button class="control-btn" id="resetBtn">Reset</button>
                <button class="control-btn" id="clearLog">Clear Log</button>
            </div>
        </div>

        <!-- Event Log -->
        <div class="debug-section">
            <h2>事件日志</h2>
            <div class="event-log" id="eventLog">
                <div class="event-log-empty">暂无事件</div>
            </div>
        </div>
    </div>

    <!-- Preview Area -->
    <h2>组件预览</h2>
    <div class="preview-area">
        <div class="preview-container" id="previewContainer" theme="dark">
            <!-- Editor Toolbar will be inserted here -->
            <!-- Mock editor area (placeholder for content) -->
            <div class="mock-editor-area">
                编辑器区域（Phase 2.6 / 2.7 实现）
            </div>
        </div>
    </div>

    <script type="module">
        // Import styles (for tokens)
        import {tokens} from '../src/styles/tokens.ts';
        import {lightTheme} from '../src/styles/themes/light.ts';
        import {darkTheme} from '../src/styles/themes/dark.ts';

        // Import component
        import '../src/components/editor-area/rtc-editor-toolbar.ts';

        // DOM elements
        const stateDisplay = document.getElementById('stateDisplay');
        const eventLog = document.getElementById('eventLog');
        const previewContainer = document.getElementById('previewContainer');
        const currentThemeEl = document.getElementById('currentTheme');
        const canSaveInfo = document.getElementById('canSaveInfo');
        const canUndoInfo = document.getElementById('canUndoInfo');
        const canRedoInfo = document.getElementById('canRedoInfo');
        const viewModeInfo = document.getElementById('viewModeInfo');

        // Create toolbar component
        const toolbar = document.createElement('rtc-editor-toolbar');
        toolbar.setAttribute('theme', 'dark');
        previewContainer.insertBefore(toolbar, previewContainer.firstChild);

        // State
        const state = {
            canSave: false,
            canUndo: false,
            canRedo: false,
            viewMode: 'split',
        };

        // Sync state → component
        function syncState() {
            toolbar.canSave = state.canSave;
            toolbar.canUndo = state.canUndo;
            toolbar.canRedo = state.canRedo;
            toolbar.viewMode = state.viewMode;

            stateDisplay.textContent = JSON.stringify(state, null, 2);

            canSaveInfo.textContent = state.canSave.toString();
            canUndoInfo.textContent = state.canUndo.toString();
            canRedoInfo.textContent = state.canRedo.toString();
            viewModeInfo.textContent = state.viewMode;
        }

        // Log event
        function logEvent(name, detail) {
            const entry = document.createElement('div');
            entry.className = 'event-log-entry';
            const detailStr = detail && Object.keys(detail).length > 0 ? JSON.stringify(detail) : '';
            entry.innerHTML = `<span class="event-name">${name}</span> <span class="event-detail">${detailStr}</span>`;

            // Remove empty placeholder
            const empty = eventLog.querySelector('.event-log-empty');
            if (empty) empty.remove();

            // Add to top
            eventLog.insertBefore(entry, eventLog.firstChild);

            // Keep only last 20 entries
            while (eventLog.children.length > 20) {
                eventLog.removeChild(eventLog.lastChild);
            }
        }

        // ── Event listeners on toolbar ──

        toolbar.addEventListener('editor-save', () => {
            logEvent('editor-save', {});
        });

        toolbar.addEventListener('editor-undo', () => {
            logEvent('editor-undo', {});
        });

        toolbar.addEventListener('editor-redo', () => {
            logEvent('editor-redo', {});
        });

        toolbar.addEventListener('editor-format', (e) => {
            logEvent('editor-format', e.detail);
        });

        toolbar.addEventListener('editor-view-mode-change', (e) => {
            logEvent('editor-view-mode-change', e.detail);
            state.viewMode = e.detail.viewMode;
            syncState();
            updateViewModeButtons();
        });

        // ── Theme buttons ──

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThemeEl.textContent = theme;

                // Resolve system theme
                let resolvedTheme = theme;
                if (theme === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    resolvedTheme = prefersDark ? 'dark' : 'light';
                }

                previewContainer.setAttribute('theme', resolvedTheme);
                toolbar.setAttribute('theme', resolvedTheme);
            });
        });

        // ── Toggle buttons ──

        function updateToggleButton(btn, key) {
            const on = state[key];
            btn.textContent = `${key.replace('can', 'can')}: ${on ? 'ON' : 'OFF'}`;
            btn.classList.toggle('toggle-on', on);
        }

        document.getElementById('toggleCanSave').addEventListener('click', () => {
            state.canSave = !state.canSave;
            updateToggleButton(document.getElementById('toggleCanSave'), 'canSave');
            syncState();
        });

        document.getElementById('toggleCanUndo').addEventListener('click', () => {
            state.canUndo = !state.canUndo;
            updateToggleButton(document.getElementById('toggleCanUndo'), 'canUndo');
            syncState();
        });

        document.getElementById('toggleCanRedo').addEventListener('click', () => {
            state.canRedo = !state.canRedo;
            updateToggleButton(document.getElementById('toggleCanRedo'), 'canRedo');
            syncState();
        });

        // ── View mode buttons ──

        function updateViewModeButtons() {
            document.querySelectorAll('[data-viewmode]').forEach(btn => {
                btn.classList.toggle('primary', btn.dataset.viewmode === state.viewMode);
            });
        }

        document.querySelectorAll('[data-viewmode]').forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.viewmode;
                state.viewMode = mode;
                syncState();
                updateViewModeButtons();
                logEvent('set-view-mode', {viewMode: mode});
            });
        });

        // ── Event trigger buttons ──

        document.getElementById('triggerSave').addEventListener('click', () => {
            toolbar.dispatchEvent(new CustomEvent('editor-save', {bubbles: true, composed: true}));
            logEvent('trigger-save', {});
        });

        document.getElementById('triggerUndo').addEventListener('click', () => {
            toolbar.dispatchEvent(new CustomEvent('editor-undo', {bubbles: true, composed: true}));
            logEvent('trigger-undo', {});
        });

        document.getElementById('triggerRedo').addEventListener('click', () => {
            toolbar.dispatchEvent(new CustomEvent('editor-redo', {bubbles: true, composed: true}));
            logEvent('trigger-redo', {});
        });

        document.getElementById('triggerBold').addEventListener('click', () => {
            toolbar.dispatchEvent(new CustomEvent('editor-format', {bubbles: true, composed: true, detail: {format: 'bold'}}));
            logEvent('trigger-format', {format: 'bold'});
        });

        document.getElementById('triggerItalic').addEventListener('click', () => {
            toolbar.dispatchEvent(new CustomEvent('editor-format', {bubbles: true, composed: true, detail: {format: 'italic'}}));
            logEvent('trigger-format', {format: 'italic'});
        });

        document.getElementById('triggerCode').addEventListener('click', () => {
            toolbar.dispatchEvent(new CustomEvent('editor-format', {bubbles: true, composed: true, detail: {format: 'code'}}));
            logEvent('trigger-format', {format: 'code'});
        });

        document.getElementById('triggerLink').addEventListener('click', () => {
            toolbar.dispatchEvent(new CustomEvent('editor-format', {bubbles: true, composed: true, detail: {format: 'link'}}));
            logEvent('trigger-format', {format: 'link'});
        });

        // ── Reset / Clear ──

        document.getElementById('resetBtn').addEventListener('click', () => {
            state.canSave = false;
            state.canUndo = false;
            state.canRedo = false;
            state.viewMode = 'split';
            syncState();
            updateToggleButton(document.getElementById('toggleCanSave'), 'canSave');
            updateToggleButton(document.getElementById('toggleCanUndo'), 'canUndo');
            updateToggleButton(document.getElementById('toggleCanRedo'), 'canRedo');
            updateViewModeButtons();
            logEvent('reset', {});
        });

        document.getElementById('clearLog').addEventListener('click', () => {
            eventLog.innerHTML = '<div class="event-log-empty">暂无事件</div>';
        });

        // Initial state
        syncState();
    </script>
</body>
</html>
