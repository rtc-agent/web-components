<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer Debug - Phase 2.3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #404040;
            color: #cccccc;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        h2 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .debug-panel {
            background: #252526;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .debug-section {
            margin-bottom: 16px;
        }

        .debug-section:last-child {
            margin-bottom: 0;
        }

        /* Theme buttons */
        .theme-buttons {
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .theme-btn:hover {
            background: #4a4a4a;
        }

        .theme-btn.active {
            background: #007acc;
            color: white;
        }

        /* State display */
        .state-display {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            color: #4ec9b0;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        /* Control buttons */
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-btn {
            padding: 6px 12px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #4a4a4a;
        }

        .control-btn.primary {
            background: #0e639c;
        }

        .control-btn.primary:hover {
            background: #1177bb;
        }

        /* Event log */
        .event-log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            color: #d4d4d4;
        }

        .event-log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #2d2d30;
        }

        .event-log-entry:last-child {
            border-bottom: none;
        }

        .event-log-entry .event-name {
            color: #dcdcaa;
        }

        .event-log-entry .event-detail {
            color: #ce9178;
        }

        .event-log-empty {
            color: #666;
            font-style: italic;
        }

        /* Preview area */
        .preview-area {
            background: #252526;
            border-radius: 8px;
            overflow: hidden;
            min-height: 400px;
        }

        .preview-container {
            display: flex;
            transition: background-color 0.2s, color 0.2s;
        }

        /* ── Theme adaptation for preview container ── */
        .preview-container[theme="dark"] {
            background: #252526;
            color: #cccccc;
            /* 暗色 token 映射 */
            --rtc-color-primary: #007acc;
            --rtc-color-primary-hover: #1e8adc;
            --rtc-color-text: #cccccc;
            --rtc-color-text-secondary: #858585;
            --rtc-color-text-tertiary: #666666;
            --rtc-color-text-inverse: #1e1e1e;
            --rtc-color-bg: #1e1e1e;
            --rtc-color-bg-secondary: #252526;
            --rtc-color-bg-tertiary: #2d2d30;
            --rtc-color-bg-hover: #2a2d2e;
            --rtc-color-bg-active: #37373d;
            --rtc-color-border: #3c3c3c;
            --rtc-color-border-hover: #4c4c4c;
            --rtc-color-border-focus: #007acc;
            --rtc-color-on-primary: #ffffff;
            --rtc-color-accent: #007acc;
        }

        .preview-container[theme="light"] {
            background: #ffffff;
            color: #333333;
            /* 亮色 token 映射 */
            --rtc-color-primary: #007acc;
            --rtc-color-primary-hover: #005a9e;
            --rtc-color-text: #333333;
            --rtc-color-text-secondary: #666666;
            --rtc-color-text-tertiary: #999999;
            --rtc-color-text-inverse: #ffffff;
            --rtc-color-bg: #ffffff;
            --rtc-color-bg-secondary: #f5f5f5;
            --rtc-color-bg-tertiary: #e8e8e8;
            --rtc-color-bg-hover: #e8e8e8;
            --rtc-color-bg-active: #d4d4d4;
            --rtc-color-border: #e0e0e0;
            --rtc-color-border-hover: #cccccc;
            --rtc-color-border-focus: #007acc;
            --rtc-color-on-primary: #ffffff;
            --rtc-color-accent: #007acc;
        }

        /* Info display */
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #4ec9b0;
            font-family: 'SF Mono', Monaco, monospace;
        }

        /* Phase label */
        .phase-label {
            display: inline-block;
            padding: 2px 8px;
            background: #0e639c;
            color: white;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h1>File Explorer Debug <span class="phase-label">Phase 2.3</span></h1>

    <div class="debug-panel">
        <!-- Theme -->
        <div class="debug-section">
            <h2>主题 (当前: <span id="currentTheme">dark</span>)</h2>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="light">☀ Light</button>
                <button class="theme-btn active" data-theme="dark">🌙 Dark</button>
                <button class="theme-btn" data-theme="system">💻 System</button>
            </div>
        </div>

        <!-- State Display -->
        <div class="debug-section">
            <h2>当前状态</h2>
            <div class="state-display" id="stateDisplay">
{
  "selectedPath": null,
  "expandedPaths": [],
  "loadingPaths": []
}
            </div>
        </div>

        <!-- Info -->
        <div class="debug-section">
            <h2>信息</h2>
            <div class="info-row">
                <span class="info-label">选中路径:</span>
                <span class="info-value" id="selectedPath">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">展开节点数:</span>
                <span class="info-value" id="expandedCount">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">加载节点数:</span>
                <span class="info-value" id="loadingCount">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">文件树节点总数:</span>
                <span class="info-value" id="totalNodes">0</span>
            </div>
        </div>

        <!-- Controller Controls -->
        <div class="debug-section">
            <h2>Controller 控制</h2>
            <div class="control-group">
                <button class="control-btn primary" id="expandAll">展开所有</button>
                <button class="control-btn" id="collapseAll">折叠所有</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="selectAgentMd">选中 AGENT.md</button>
                <button class="control-btn" id="selectCheckout">选中 checkout.md</button>
                <button class="control-btn" id="clearSelection">清除选中</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="simulateLoading">模拟加载 /scripts</button>
                <button class="control-btn" id="reloadMock">重新加载 Mock</button>
            </div>
        </div>

        <!-- Reset -->
        <div class="debug-section">
            <div class="control-group">
                <button class="control-btn" id="resetBtn">Reset</button>
                <button class="control-btn" id="clearLog">Clear Log</button>
            </div>
        </div>

        <!-- Event Log -->
        <div class="debug-section">
            <h2>事件日志</h2>
            <div class="event-log" id="eventLog">
                <div class="event-log-empty">暂无事件</div>
            </div>
        </div>
    </div>

    <!-- Preview Area -->
    <h2>组件预览</h2>
    <div class="preview-area">
        <div class="preview-container" id="previewContainer" theme="dark">
            <!-- File Explorer will be inserted here -->
        </div>
    </div>

    <script type="module">
        // Import styles (for tokens)
        import {tokens} from '../src/styles/tokens.ts';
        import {lightTheme} from '../src/styles/themes/light.ts';
        import {darkTheme} from '../src/styles/themes/dark.ts';

        // Import component
        import '../src/components/file-explorer/rtc-file-explorer.ts';

        // Import context provider helper
        import {ContextProvider} from '@lit/context';
        import {FileExplorerContext} from '../src/contexts/file-explorer.ts';
        import {FileExplorerController} from '../src/controllers/file-explorer.controller.ts';

        // Mock data — 模拟 VFS 目录结构
        const mockTree = {
            path: '/',
            name: 'root',
            type: 'folder',
            children: [
                {
                    path: '/functions',
                    name: 'functions',
                    type: 'folder',
                    children: [
                        {
                            path: '/functions/user',
                            name: 'user',
                            type: 'folder',
                            children: [
                                { path: '/functions/user/login.md', name: 'login.md', type: 'file' },
                                { path: '/functions/user/logout.md', name: 'logout.md', type: 'file' },
                                { path: '/functions/user/register.md', name: 'register.md', type: 'file' },
                            ]
                        },
                        {
                            path: '/functions/order',
                            name: 'order',
                            type: 'folder',
                            children: [
                                { path: '/functions/order/create.md', name: 'create.md', type: 'file' },
                                { path: '/functions/order/cancel.md', name: 'cancel.md', type: 'file' },
                            ]
                        },
                    ]
                },
                {
                    path: '/scenarios',
                    name: 'scenarios',
                    type: 'folder',
                    children: [
                        { path: '/scenarios/checkout.md', name: 'checkout.md', type: 'file' },
                        { path: '/scenarios/payment.md', name: 'payment.md', type: 'file' },
                        { path: '/scenarios/user-flow.md', name: 'user-flow.md', type: 'file' },
                        { path: '/scenarios/refund.md', name: 'refund.md', type: 'file' },
                    ]
                },
                {
                    path: '/scripts',
                    name: 'scripts',
                    type: 'folder',
                    children: []
                },
                { path: '/AGENT.md', name: 'AGENT.md', type: 'file' }
            ]
        };

        // Simple host object (mirrors Lit ReactiveControllerHost)
        const debugHost = {
            _controllers: [],
            _updateCallbacks: [],
            addController(controller) {
                this._controllers.push(controller);
                controller.hostConnected?.();
            },
            requestUpdate() {
                this._updateCallbacks.forEach(cb => cb());
            },
            onUpdate(callback) {
                this._updateCallbacks.push(callback);
            }
        };

        // Create controller
        const fileExplorerController = new FileExplorerController(debugHost);

        // Context provider (custom element wrapping ContextProvider)
        class FileExplorerProvider extends HTMLElement {
            constructor() {
                super();
                this._provider = new ContextProvider(this, {
                    context: FileExplorerContext,
                    initialValue: fileExplorerController.value,
                });
            }

            updateValue() {
                this._provider.setValue(fileExplorerController.value);
            }
        }
        customElements.define('file-explorer-provider', FileExplorerProvider);

        // DOM elements
        const stateDisplay = document.getElementById('stateDisplay');
        const eventLog = document.getElementById('eventLog');
        const previewContainer = document.getElementById('previewContainer');
        const currentThemeEl = document.getElementById('currentTheme');
        const selectedPathEl = document.getElementById('selectedPath');
        const expandedCountEl = document.getElementById('expandedCount');
        const loadingCountEl = document.getElementById('loadingCount');
        const totalNodesEl = document.getElementById('totalNodes');

        // Create provider element
        const provider = document.createElement('file-explorer-provider');
        previewContainer.appendChild(provider);

        // Create file explorer component
        const fileExplorer = document.createElement('rtc-file-explorer');
        fileExplorer.setAttribute('theme', 'dark');
        provider.appendChild(fileExplorer);

        // Update context when controller changes
        debugHost.onUpdate(() => {
            provider.updateValue();
            updateStateDisplay();
            // Sync root to component
            fileExplorer.root = fileExplorerController.state.root;
        });

        // Initialize mock data
        function loadMockData() {
            fileExplorerController.actions.setRoot(JSON.parse(JSON.stringify(mockTree)));
            // Expand root and scenarios by default
            fileExplorerController.actions.toggleNode('/');
            fileExplorerController.actions.toggleNode('/scenarios');
        }

        loadMockData();

        // Count total nodes recursively
        function countNodes(node) {
            if (!node) return 0;
            let count = 1;
            if (node.children) {
                for (const child of node.children) {
                    count += countNodes(child);
                }
            }
            return count;
        }

        // Update state display
        function updateStateDisplay() {
            const expandedPaths = [];
            const loadingPaths = [];

            function collectPaths(node) {
                if (!node) return;
                if (fileExplorerController.value.isExpanded(node.path)) {
                    expandedPaths.push(node.path);
                }
                if (fileExplorerController.value.isLoading(node.path)) {
                    loadingPaths.push(node.path);
                }
                if (node.children) {
                    node.children.forEach(collectPaths);
                }
            }

            if (fileExplorerController.state.root) {
                collectPaths(fileExplorerController.state.root);
            }

            const state = {
                selectedPath: fileExplorerController.state.selectedPath,
                expandedPaths,
                loadingPaths,
            };

            stateDisplay.textContent = JSON.stringify(state, null, 2);

            // Update info display
            selectedPathEl.textContent = fileExplorerController.state.selectedPath || '-';
            expandedCountEl.textContent = expandedPaths.length.toString();
            loadingCountEl.textContent = loadingPaths.length.toString();
            totalNodesEl.textContent = countNodes(fileExplorerController.state.root).toString();
        }

        // Log event
        function logEvent(name, detail) {
            const entry = document.createElement('div');
            entry.className = 'event-log-entry';
            entry.innerHTML = `<span class="event-name">${name}</span> <span class="event-detail">${JSON.stringify(detail)}</span>`;

            // Remove empty placeholder
            const empty = eventLog.querySelector('.event-log-empty');
            if (empty) empty.remove();

            // Add to top
            eventLog.insertBefore(entry, eventLog.firstChild);

            // Keep only last 20 entries
            while (eventLog.children.length > 20) {
                eventLog.removeChild(eventLog.lastChild);
            }
        }

        // ── Event listeners on file-explorer ──

        fileExplorer.addEventListener('file-select', (e) => {
            logEvent('file-select', e.detail);
        });

        fileExplorer.addEventListener('folder-toggle', (e) => {
            logEvent('folder-toggle', e.detail);
        });

        fileExplorer.addEventListener('refresh-requested', () => {
            logEvent('refresh-requested', {});
        });

        fileExplorer.addEventListener('new-file-requested', () => {
            logEvent('new-file-requested', {});
        });

        // ── Theme buttons ──

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThemeEl.textContent = theme;

                // Resolve system theme
                let resolvedTheme = theme;
                if (theme === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    resolvedTheme = prefersDark ? 'dark' : 'light';
                }

                previewContainer.setAttribute('theme', resolvedTheme);
                fileExplorer.setAttribute('theme', resolvedTheme);

                // Update provider to trigger re-render
                provider.updateValue();
            });
        });

        // ── Controller controls ──

        document.getElementById('expandAll').addEventListener('click', () => {
            fileExplorerController.actions.expandAll();
            logEvent('expandAll', {});
        });

        document.getElementById('collapseAll').addEventListener('click', () => {
            fileExplorerController.actions.collapseAll();
            logEvent('collapseAll', {});
        });

        document.getElementById('selectAgentMd').addEventListener('click', () => {
            fileExplorerController.actions.selectNode('/AGENT.md');
            logEvent('selectNode', {path: '/AGENT.md'});
        });

        document.getElementById('selectCheckout').addEventListener('click', () => {
            fileExplorerController.actions.selectNode('/scenarios/checkout.md');
            logEvent('selectNode', {path: '/scenarios/checkout.md'});
        });

        document.getElementById('clearSelection').addEventListener('click', () => {
            fileExplorerController.actions.selectNode('');
            logEvent('clearSelection', {});
        });

        document.getElementById('simulateLoading').addEventListener('click', () => {
            const path = '/scripts';
            fileExplorerController.actions.setLoading(path, true);
            logEvent('simulate-loading', {path, loading: true});

            // Simulate loading complete after 2 seconds
            setTimeout(() => {
                fileExplorerController.actions.setLoading(path, false);
                fileExplorerController.actions.updateChildren(path, [
                    { path: '/scripts/new-script.js', name: 'new-script.js', type: 'file' },
                    { path: '/scripts/another.ts', name: 'another.ts', type: 'file' },
                    { path: '/scripts/util.js', name: 'util.js', type: 'file' },
                ]);
                fileExplorerController.actions.toggleNode(path);
                logEvent('simulate-loading', {path, loading: false, childrenAdded: 3});
            }, 2000);
        });

        document.getElementById('reloadMock').addEventListener('click', () => {
            fileExplorerController.actions.reset();
            loadMockData();
            logEvent('reload-mock', {});
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            fileExplorerController.actions.reset();
            loadMockData();
            logEvent('reset', {});
        });

        document.getElementById('clearLog').addEventListener('click', () => {
            eventLog.innerHTML = '<div class="event-log-empty">暂无事件</div>';
        });

        // Initial state display
        updateStateDisplay();
    </script>
</body>
</html>
