<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Tree Item Debug - Step 4.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #404040;
            color: #cccccc;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        h2 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .debug-panel {
            background: #252526;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .debug-section {
            margin-bottom: 16px;
        }

        .debug-section:last-child {
            margin-bottom: 0;
        }

        /* Theme buttons */
        .theme-buttons {
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .theme-btn:hover {
            background: #4a4a4a;
        }

        .theme-btn.active {
            background: #007acc;
            color: white;
        }

        /* Control buttons */
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-btn {
            padding: 6px 12px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #4a4a4a;
        }

        .control-btn.primary {
            background: #0e639c;
        }

        .control-btn.primary:hover {
            background: #1177bb;
        }

        /* Event log */
        .event-log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            color: #d4d4d4;
        }

        .event-log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #2d2d30;
        }

        .event-log-entry:last-child {
            border-bottom: none;
        }

        .event-log-entry .event-name {
            color: #dcdcaa;
        }

        .event-log-entry .event-detail {
            color: #ce9178;
        }

        .event-log-empty {
            color: #666;
            font-style: italic;
        }

        /* Preview area */
        .preview-area {
            background: #252526;
            border-radius: 8px;
            overflow: hidden;
            min-height: 400px;
        }

        .preview-container {
            width: 280px;
            transition: background-color 0.2s, color 0.2s;
        }

        .preview-container[theme="dark"] {
            background: #252526;
            color: #cccccc;
        }

        .preview-container[theme="light"] {
            background: #ffffff;
            color: #333333;
        }

        .preview-container .sidebar-header {
            padding: 12px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-container[theme="dark"] .sidebar-header {
            background: #2d2d30;
            border-bottom: 1px solid #1a1a1a;
            color: #888;
        }

        .preview-container[theme="light"] .sidebar-header {
            background: #f3f3f3;
            border-bottom: 1px solid #e0e0e0;
            color: #666;
        }

        .preview-container .sidebar-content {
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <h1>Session Tree Item Debug</h1>

    <div class="debug-panel">
        <!-- Theme -->
        <div class="debug-section">
            <h2>主题 (当前: <span id="currentTheme">dark</span>)</h2>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="light">Light</button>
                <button class="theme-btn active" data-theme="dark">Dark</button>
                <button class="theme-btn" data-theme="system">System</button>
            </div>
        </div>

        <!-- Controller Controls -->
        <div class="debug-section">
            <h2>Controller 控制</h2>
            <div class="control-group">
                <button class="control-btn primary" id="expandAll">展开所有</button>
                <button class="control-btn" id="collapseAll">折叠所有</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="selectRoot1">选中 Session 1</button>
                <button class="control-btn" id="selectRoot2">选中 Session 2</button>
                <button class="control-btn" id="selectChild21">选中 Child 2.1</button>
                <button class="control-btn" id="clearSelection">清除选中</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="addSession">添加新 Session</button>
                <button class="control-btn" id="addChildSession">添加子 Session</button>
                <button class="control-btn" id="reloadMock">重新加载 Mock</button>
            </div>
        </div>

        <!-- Reset -->
        <div class="debug-section">
            <div class="control-group">
                <button class="control-btn" id="resetBtn">Reset</button>
                <button class="control-btn" id="clearLog">Clear Log</button>
            </div>
        </div>

        <!-- Event Log -->
        <div class="debug-section">
            <h2>事件日志</h2>
            <div class="event-log" id="eventLog">
                <div class="event-log-empty">暂无事件</div>
            </div>
        </div>
    </div>

    <!-- Preview Area -->
    <h2>组件预览</h2>
    <div class="preview-area">
        <div class="preview-container" id="previewContainer" theme="dark">
            <div class="sidebar-header">
                <span>Session Tree</span>
            </div>
            <div class="sidebar-content" id="treeContainer">
                <!-- Tree items will be inserted here -->
            </div>
        </div>
    </div>

    <script type="module">
        // Import component
        import '../src/components/session-tree/rtc-session-tree-item.ts';

        // Import controller
        import {SessionTreeController} from '../src/controllers/session-tree.controller.ts';

        // Import styles
        import {tokens} from '../src/styles/tokens.ts';
        import {lightTheme} from '../src/styles/themes/light.ts';
        import {darkTheme} from '../src/styles/themes/dark.ts';

        // Simple host object
        const debugHost = {
            _controllers: [],
            _updateCallbacks: [],
            addController(controller) {
                this._controllers.push(controller);
                controller.hostConnected?.();
            },
            requestUpdate() {
                this._updateCallbacks.forEach(cb => cb());
            },
            onUpdate(callback) {
                this._updateCallbacks.push(callback);
            }
        };

        // Create controller
        const treeController = new SessionTreeController(debugHost);

        // DOM elements
        const eventLog = document.getElementById('eventLog');
        const previewContainer = document.getElementById('previewContainer');
        const treeContainer = document.getElementById('treeContainer');
        const currentThemeEl = document.getElementById('currentTheme');

        // Mock sessions
        const mockSessions = [
            { clientId: 'root-1', title: 'Main Conversation', createdAt: Date.now() - 3600000, updatedAt: Date.now() - 60000 },
            { clientId: 'root-2', title: 'Code Review Session', createdAt: Date.now() - 7200000, updatedAt: Date.now() - 120000 },
            { clientId: 'child-21', title: 'Fork: Fix bug in auth', createdAt: Date.now() - 5400000, updatedAt: Date.now() - 30000, rootClientSessionId: 'root-2' },
            { clientId: 'child-22', title: 'Fork: Add tests', createdAt: Date.now() - 4800000, updatedAt: Date.now() - 15000, rootClientSessionId: 'root-2' },
            { clientId: 'root-3', title: 'Design Discussion', createdAt: Date.now() - 10800000, updatedAt: Date.now() - 180000 },
        ];

        let selectedSessionId = null;
        let currentTheme = 'dark';

        // Initialize mock data
        function loadMockData() {
            treeController.actions.rebuildTree(mockSessions);
            // Expand root-2 by default to show children
            treeController.actions.expand('root-2');
        }

        loadMockData();

        // Render tree items
        function renderTree() {
            treeContainer.innerHTML = '';
            const rootNodes = treeController.value.state.rootNodes;

            rootNodes.forEach(node => {
                const treeItem = document.createElement('rtc-session-tree-item');
                treeItem.node = node;
                treeItem.depth = 0;
                treeItem.theme = currentTheme;
                treeItem.selectedSessionId = selectedSessionId ?? '';

                treeItem.addEventListener('rtc-session-tree-item-select', (e) => {
                    logEvent('rtc-session-tree-item-select', e.detail);
                    selectedSessionId = e.detail.sessionId;
                    renderTree();
                });

                treeItem.addEventListener('rtc-session-tree-item-toggle', (e) => {
                    logEvent('rtc-session-tree-item-toggle', e.detail);
                    treeController.actions.toggleExpand(e.detail.sessionId);
                });

                treeContainer.appendChild(treeItem);
            });
        }

        // Update tree when controller changes
        debugHost.onUpdate(() => {
            renderTree();
        });

        renderTree();

        // Log event
        function logEvent(name, detail) {
            const entry = document.createElement('div');
            entry.className = 'event-log-entry';
            entry.innerHTML = `<span class="event-name">${name}</span> <span class="event-detail">${JSON.stringify(detail)}</span>`;

            const empty = eventLog.querySelector('.event-log-empty');
            if (empty) empty.remove();

            eventLog.insertBefore(entry, eventLog.firstChild);

            while (eventLog.children.length > 20) {
                eventLog.removeChild(eventLog.lastChild);
            }
        }

        // Theme buttons
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThemeEl.textContent = theme;

                let resolvedTheme = theme;
                if (theme === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    resolvedTheme = prefersDark ? 'dark' : 'light';
                }

                currentTheme = resolvedTheme;
                previewContainer.setAttribute('theme', resolvedTheme);
                renderTree();
            });
        });

        // Controller controls
        document.getElementById('expandAll').addEventListener('click', () => {
            treeController.value.state.rootNodes.forEach(node => {
                treeController.actions.expand(node.session.clientId);
            });
        });

        document.getElementById('collapseAll').addEventListener('click', () => {
            treeController.value.state.rootNodes.forEach(node => {
                treeController.actions.collapse(node.session.clientId);
            });
        });

        document.getElementById('selectRoot1').addEventListener('click', () => {
            selectedSessionId = 'root-1';
            renderTree();
            logEvent('select', {sessionId: 'root-1'});
        });

        document.getElementById('selectRoot2').addEventListener('click', () => {
            selectedSessionId = 'root-2';
            renderTree();
            logEvent('select', {sessionId: 'root-2'});
        });

        document.getElementById('selectChild21').addEventListener('click', () => {
            selectedSessionId = 'child-21';
            treeController.actions.expand('root-2');
            renderTree();
            logEvent('select', {sessionId: 'child-21'});
        });

        document.getElementById('clearSelection').addEventListener('click', () => {
            selectedSessionId = null;
            renderTree();
            logEvent('clear-selection', {});
        });

        document.getElementById('addSession').addEventListener('click', () => {
            const newSession = {
                clientId: `root-${Date.now()}`,
                title: `New Session ${Date.now()}`,
                createdAt: Date.now(),
                updatedAt: Date.now(),
            };
            mockSessions.push(newSession);
            treeController.actions.rebuildTree(mockSessions);
            logEvent('add-session', {clientId: newSession.clientId});
        });

        document.getElementById('addChildSession').addEventListener('click', () => {
            const newChild = {
                clientId: `child-${Date.now()}`,
                title: `New Child ${Date.now()}`,
                createdAt: Date.now(),
                updatedAt: Date.now(),
                rootClientSessionId: 'root-2',
            };
            mockSessions.push(newChild);
            treeController.actions.rebuildTree(mockSessions);
            treeController.actions.expand('root-2');
            logEvent('add-child-session', {clientId: newChild.clientId});
        });

        document.getElementById('reloadMock').addEventListener('click', () => {
            loadMockData();
            logEvent('reload-mock', {});
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            selectedSessionId = null;
            loadMockData();
            logEvent('reset', {});
        });

        document.getElementById('clearLog').addEventListener('click', () => {
            eventLog.innerHTML = '<div class="event-log-empty">暂无事件</div>';
        });
    </script>
</body>
</html>
