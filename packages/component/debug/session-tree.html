<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Tree Debug - Step 5.1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #404040;
            color: #cccccc;
            padding: 20px;
            min-height: 100vh;
        }

        h1 { font-size: 20px; margin-bottom: 20px; color: #ffffff; }
        h2 { font-size: 14px; margin-bottom: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }

        .debug-panel {
            background: #252526;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .debug-section { margin-bottom: 16px; }
        .debug-section:last-child { margin-bottom: 0; }

        .theme-buttons, .control-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }

        .theme-btn, .control-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .theme-btn:hover, .control-btn:hover { background: #4a4a4a; }
        .theme-btn.active { background: #007acc; color: white; }
        .control-btn.primary { background: #0e639c; }
        .control-btn.primary:hover { background: #1177bb; }

        .event-log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            color: #d4d4d4;
        }

        .event-log-entry { padding: 4px 0; border-bottom: 1px solid #2d2d30; }
        .event-log-entry:last-child { border-bottom: none; }
        .event-log-entry .event-name { color: #dcdcaa; }
        .event-log-entry .event-detail { color: #ce9178; }
        .event-log-empty { color: #666; font-style: italic; }

        .preview-area {
            background: #252526;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-container {
            display: flex;
            height: 400px;
            transition: background-color 0.2s, color 0.2s;
        }

        .preview-container[theme="dark"] { background: #252526; color: #cccccc; }
        .preview-container[theme="light"] { background: #ffffff; color: #333333; }

        .tree-sidebar {
            width: 260px;
            flex-shrink: 0;
        }

        .tab-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .content-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Session Tree + Tab Bar Debug (Step 5)</h1>

    <div class="debug-panel">
        <div class="debug-section">
            <h2>主题 (当前: <span id="currentTheme">dark</span>)</h2>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="light">Light</button>
                <button class="theme-btn active" data-theme="dark">Dark</button>
                <button class="theme-btn" data-theme="system">System</button>
            </div>
        </div>

        <div class="debug-section">
            <h2>Controller 控制</h2>
            <div class="control-group">
                <button class="control-btn primary" id="expandAll">展开所有</button>
                <button class="control-btn" id="collapseAll">折叠所有</button>
            </div>
            <div class="control-group">
                <button class="control-btn primary" id="selectRoot1">选中 Session 1</button>
                <button class="control-btn" id="selectRoot2">选中 Session 2</button>
                <button class="control-btn" id="selectChild21">选中 Child 2.1</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="addSession">添加新 Session</button>
                <button class="control-btn" id="addChildSession">添加子 Session</button>
                <button class="control-btn" id="reloadMock">重新加载 Mock</button>
            </div>
            <div class="control-group">
                <button class="control-btn" id="resetBtn">Reset</button>
                <button class="control-btn" id="clearLog">Clear Log</button>
            </div>
        </div>

        <div class="debug-section">
            <h2>事件日志</h2>
            <div class="event-log" id="eventLog">
                <div class="event-log-empty">暂无事件</div>
            </div>
        </div>
    </div>

    <h2>组件预览</h2>
    <div class="preview-area">
        <div class="preview-container" id="previewContainer" theme="dark">
            <div class="tree-sidebar" id="treeSidebar">
                <rtc-session-tree id="sessionTree" theme="dark"></rtc-session-tree>
            </div>
            <div class="tab-area">
                <rtc-session-tab-bar id="sessionTabBar" theme="dark"></rtc-session-tab-bar>
                <div class="content-placeholder" id="contentPlaceholder">
                    选择一个会话开始对话
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import '../src/components/session-tree/rtc-session-tree.ts';
        import '../src/components/session-tree/rtc-session-tab-bar.ts';
        import {SessionTreeController} from '../src/controllers/session-tree.controller.ts';
        import {SessionTabController} from '../src/controllers/session-tab.controller.ts';
        import {SessionTreeContext} from '../src/contexts/session-tree.ts';
        import {SessionTabContext} from '../src/contexts/session-tab.ts';
        import {ContextProvider} from '@lit/context';

        const previewContainer = document.getElementById('previewContainer');

        // Simple host
        const treeHost = {
            _updateCallbacks: [],
            addController(c) { c.hostConnected?.(); },
            requestUpdate() { this._updateCallbacks.forEach(cb => cb()); },
            onUpdate(cb) { this._updateCallbacks.push(cb); },
            dispatchEvent() {},
        };

        const tabHost = {
            _updateCallbacks: [],
            addController(c) { c.hostConnected?.(); },
            requestUpdate() { this._updateCallbacks.forEach(cb => cb()); },
            onUpdate(cb) { this._updateCallbacks.push(cb); },
            dispatchEvent() {},
        };

        const treeController = new SessionTreeController(treeHost);
        const tabController = new SessionTabController(tabHost);

        // Context provider custom elements
        class SessionTreeProvider extends HTMLElement {
            constructor() {
                super();
                this._provider = new ContextProvider(this, {
                    context: SessionTreeContext,
                    initialValue: treeController.value,
                });
            }
            updateValue() {
                this._provider.setValue(treeController.value);
            }
        }
        customElements.define('session-tree-provider', SessionTreeProvider);

        class SessionTabProvider extends HTMLElement {
            constructor() {
                super();
                this._provider = new ContextProvider(this, {
                    context: SessionTabContext,
                    initialValue: tabController.value,
                });
            }
            updateValue() {
                this._provider.setValue(tabController.value);
            }
        }
        customElements.define('session-tab-provider', SessionTabProvider);

        // Wrap consumer components in provider elements
        const treeSidebar = document.getElementById('treeSidebar');

        const treeProvider = document.createElement('session-tree-provider');
        treeSidebar.appendChild(treeProvider);
        treeProvider.appendChild(document.getElementById('sessionTree'));

        // 直接在 previewContainer 上提供 tab context，不用 wrapper
        const tabProvider = document.createElement('session-tab-provider');
        previewContainer.appendChild(tabProvider);
        tabProvider.style.cssText = 'display: contents;';

        const sessionTabBar = document.getElementById('sessionTabBar');
        // 把 tab bar 移到 tab-area，但在 tabProvider 内部
        const tabArea = document.querySelector('.tab-area');
        tabProvider.appendChild(sessionTabBar);
        tabArea.insertBefore(tabProvider, tabArea.firstChild);

        const sessionTree = document.getElementById('sessionTree');
        const contentPlaceholder = document.getElementById('contentPlaceholder');
        const eventLog = document.getElementById('eventLog');
        const currentThemeEl = document.getElementById('currentTheme');

        // Mock sessions
        const mockSessions = [
            { clientId: 'root-1', title: 'Main Conversation', createdAt: Date.now() - 3600000, updatedAt: Date.now() - 60000 },
            { clientId: 'root-2', title: 'Code Review Session', createdAt: Date.now() - 7200000, updatedAt: Date.now() - 120000 },
            { clientId: 'child-21', title: 'Fork: Fix bug in auth', createdAt: Date.now() - 5400000, updatedAt: Date.now() - 30000, rootClientSessionId: 'root-2' },
            { clientId: 'child-22', title: 'Fork: Add tests', createdAt: Date.now() - 4800000, updatedAt: Date.now() - 15000, rootClientSessionId: 'root-2' },
            { clientId: 'root-3', title: 'Design Discussion', createdAt: Date.now() - 10800000, updatedAt: Date.now() - 180000 },
        ];

        let selectedSessionId = null;
        let currentTheme = 'dark';

        function loadMockData() {
            treeController.actions.rebuildTree(mockSessions);
            treeController.actions.expand('root-2');
        }

        loadMockData();

        function updateProviders() {
            treeProvider.updateValue();
            tabProvider.updateValue();
        }

        treeHost.onUpdate(() => { updateProviders(); });
        tabHost.onUpdate(() => { updateProviders(); });

        // Tree events
        sessionTree.addEventListener('rtc-session-tree-select', (e) => {
            const {sessionId} = e.detail;
            selectedSessionId = sessionId;
            sessionTree.selectedSessionId = sessionId;
            // Open or activate tab
            const session = mockSessions.find(s => s.clientId === sessionId);
            if (session) {
                tabController.actions.openOrActivate(sessionId, session.title);
            }
            logEvent('rtc-session-tree-select', e.detail);
        });

        sessionTree.addEventListener('rtc-session-tree-toggle', (e) => {
            logEvent('rtc-session-tree-toggle', e.detail);
        });

        sessionTree.addEventListener('rtc-session-tree-new', () => {
            const newSession = {
                clientId: `root-${Date.now()}`,
                title: `New Session`,
                createdAt: Date.now(),
                updatedAt: Date.now(),
            };
            mockSessions.push(newSession);
            treeController.actions.rebuildTree(mockSessions);
            logEvent('rtc-session-tree-new', {});
        });

        // Tab bar events
        sessionTabBar.addEventListener('rtc-session-tab-bar-activate', (e) => {
            const {sessionId} = e.detail;
            selectedSessionId = sessionId;
            sessionTree.selectedSessionId = sessionId;
            contentPlaceholder.textContent = `Chat: ${mockSessions.find(s => s.clientId === sessionId)?.title || sessionId}`;
            logEvent('rtc-session-tab-bar-activate', e.detail);
        });

        sessionTabBar.addEventListener('rtc-session-tab-bar-close', (e) => {
            logEvent('rtc-session-tab-bar-close', e.detail);
            // If the closed tab was selected, clear selection
            if (e.detail.sessionId === selectedSessionId) {
                selectedSessionId = null;
                sessionTree.selectedSessionId = null;
                contentPlaceholder.textContent = '选择一个会话开始对话';
            }
        });

        updateProviders();

        function logEvent(name, detail) {
            const entry = document.createElement('div');
            entry.className = 'event-log-entry';
            entry.innerHTML = `<span class="event-name">${name}</span> <span class="event-detail">${JSON.stringify(detail)}</span>`;
            const empty = eventLog.querySelector('.event-log-empty');
            if (empty) empty.remove();
            eventLog.insertBefore(entry, eventLog.firstChild);
            while (eventLog.children.length > 20) eventLog.removeChild(eventLog.lastChild);
        }

        // Theme buttons
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThemeEl.textContent = theme;
                let resolvedTheme = theme;
                if (theme === 'system') {
                    resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                currentTheme = resolvedTheme;
                previewContainer.setAttribute('theme', resolvedTheme);
                sessionTree.setAttribute('theme', resolvedTheme);
                sessionTabBar.setAttribute('theme', resolvedTheme);
            });
        });

        // Controls
        document.getElementById('expandAll').addEventListener('click', () => {
            treeController.value.state.rootNodes.forEach(node => treeController.actions.expand(node.session.clientId));
        });

        document.getElementById('collapseAll').addEventListener('click', () => {
            treeController.value.state.rootNodes.forEach(node => treeController.actions.collapse(node.session.clientId));
        });

        document.getElementById('selectRoot1').addEventListener('click', () => {
            selectedSessionId = 'root-1';
            sessionTree.selectedSessionId = 'root-1';
            tabController.actions.openOrActivate('root-1', 'Main Conversation');
        });

        document.getElementById('selectRoot2').addEventListener('click', () => {
            selectedSessionId = 'root-2';
            sessionTree.selectedSessionId = 'root-2';
            tabController.actions.openOrActivate('root-2', 'Code Review Session');
        });

        document.getElementById('selectChild21').addEventListener('click', () => {
            selectedSessionId = 'child-21';
            sessionTree.selectedSessionId = 'child-21';
            treeController.actions.expand('root-2');
            tabController.actions.openOrActivate('child-21', 'Fork: Fix bug in auth');
        });

        document.getElementById('addSession').addEventListener('click', () => {
            mockSessions.push({ clientId: `root-${Date.now()}`, title: `New Session ${Date.now()}`, createdAt: Date.now(), updatedAt: Date.now() });
            treeController.actions.rebuildTree(mockSessions);
        });

        document.getElementById('addChildSession').addEventListener('click', () => {
            mockSessions.push({ clientId: `child-${Date.now()}`, title: `New Child`, createdAt: Date.now(), updatedAt: Date.now(), rootClientSessionId: 'root-2' });
            treeController.actions.rebuildTree(mockSessions);
            treeController.actions.expand('root-2');
        });

        document.getElementById('reloadMock').addEventListener('click', () => { loadMockData(); });

        document.getElementById('resetBtn').addEventListener('click', () => {
            selectedSessionId = null;
            sessionTree.selectedSessionId = null;
            tabController.actions.clearAll();
            loadMockData();
        });

        document.getElementById('clearLog').addEventListener('click', () => {
            eventLog.innerHTML = '<div class="event-log-empty">暂无事件</div>';
        });
    </script>
</body>
</html>
