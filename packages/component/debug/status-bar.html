<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Bar Debug - Phase 2.8</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #404040;
            color: #cccccc;
            padding: 20px;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        h2 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .phase-label {
            display: inline-block;
            padding: 2px 8px;
            background: #0e639c;
            color: white;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .debug-panel {
            background: #252526;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .debug-section {
            margin-bottom: 16px;
        }

        .debug-section:last-child {
            margin-bottom: 0;
        }

        /* ── Theme buttons ── */
        .theme-buttons {
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .theme-btn:hover {
            background: #4a4a4a;
        }

        .theme-btn.active {
            background: #007acc;
            color: white;
        }

        /* ── State display ── */
        .state-display {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            color: #4ec9b0;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        /* ── Control buttons ── */
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-btn {
            padding: 6px 12px;
            background: #3a3a3a;
            border: none;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #4a4a4a;
        }

        .control-btn.primary {
            background: #0e639c;
        }

        .control-btn.primary:hover {
            background: #1177bb;
        }

        .control-btn.danger {
            background: #5a1d1d;
        }

        .control-btn.danger:hover {
            background: #7a2d2d;
        }

        /* ── Event log ── */
        .event-log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            color: #d4d4d4;
        }

        .event-log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #2d2d30;
        }

        .event-log-entry:last-child {
            border-bottom: none;
        }

        .event-log-entry .event-time {
            color: #858585;
            margin-right: 8px;
        }

        .event-log-entry .event-name {
            color: #dcdcaa;
        }

        .event-log-entry .event-detail {
            color: #ce9178;
        }

        .event-log-empty {
            color: #666;
            font-style: italic;
        }

        /* ── Preview area ── */
        .preview-area {
            background: #252526;
            border-radius: 8px;
            padding: 16px;
        }

        .preview-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .preview-container {
            transition: background-color 0.2s, color 0.2s;
        }

        /* ── Theme adaptation for preview container ── */
        .preview-container[theme="dark"] {
            background: #1e1e1e;
            color: #cccccc;
            --rtc-color-primary: #007acc;
            --rtc-color-primary-hover: #1e8adc;
            --rtc-color-text: #cccccc;
            --rtc-color-text-secondary: #858585;
            --rtc-color-text-tertiary: #666666;
            --rtc-color-text-inverse: #1e1e1e;
            --rtc-color-bg: #1e1e1e;
            --rtc-color-bg-secondary: #252526;
            --rtc-color-bg-tertiary: #2d2d30;
            --rtc-color-bg-hover: #2a2d2e;
            --rtc-color-bg-active: #37373d;
            --rtc-color-border: #3c3c3c;
            --rtc-color-border-hover: #4c4c4c;
            --rtc-color-border-focus: #007acc;
            --rtc-color-on-primary: #ffffff;
            --rtc-color-accent: #007acc;
            --rtc-color-error: #f48771;
            --rtc-spacing-xs: 4px;
            --rtc-spacing-sm: 8px;
            --rtc-spacing-md: 12px;
            --rtc-spacing-lg: 16px;
            --rtc-font-size-sm: 13px;
            --rtc-font-size-md: 14px;
            --rtc-font-size-lg: 16px;
            --rtc-border-radius-sm: 4px;
            --rtc-border-radius-md: 6px;
            --rtc-transition-duration: 0.15s;
            --rtc-transition-timing: ease;
        }

        .preview-container[theme="light"] {
            background: #ffffff;
            color: #333333;
            --rtc-color-primary: #007acc;
            --rtc-color-primary-hover: #005a9e;
            --rtc-color-text: #333333;
            --rtc-color-text-secondary: #666666;
            --rtc-color-text-tertiary: #999999;
            --rtc-color-text-inverse: #ffffff;
            --rtc-color-bg: #ffffff;
            --rtc-color-bg-secondary: #f5f5f5;
            --rtc-color-bg-tertiary: #e8e8e8;
            --rtc-color-bg-hover: #e8e8e8;
            --rtc-color-bg-active: #d4d4d4;
            --rtc-color-border: #e0e0e0;
            --rtc-color-border-hover: #cccccc;
            --rtc-color-border-focus: #007acc;
            --rtc-color-on-primary: #ffffff;
            --rtc-color-accent: #007acc;
            --rtc-color-error: #d32f2f;
            --rtc-spacing-xs: 4px;
            --rtc-spacing-sm: 8px;
            --rtc-spacing-md: 12px;
            --rtc-spacing-lg: 16px;
            --rtc-font-size-sm: 13px;
            --rtc-font-size-md: 14px;
            --rtc-font-size-lg: 16px;
            --rtc-border-radius-sm: 4px;
            --rtc-border-radius-md: 6px;
            --rtc-transition-duration: 0.15s;
            --rtc-transition-timing: ease;
        }

        /* ── Info rows ── */
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #4ec9b0;
            font-family: 'SF Mono', Monaco, monospace;
        }
    </style>
</head>
<body>
    <h1>Status Bar Debug <span class="phase-label">Phase 2.8</span></h1>

    <div class="debug-panel">
        <!-- Theme -->
        <div class="debug-section">
            <h2>主题 (当前: <span id="currentTheme">dark</span>)</h2>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="light">☀ Light</button>
                <button class="theme-btn active" data-theme="dark">🌙 Dark</button>
            </div>
        </div>

        <!-- State Display -->
        <div class="debug-section">
            <h2>当前状态</h2>
            <div class="state-display" id="stateDisplay">{}</div>
        </div>

        <!-- Info -->
        <div class="debug-section">
            <h2>信息</h2>
            <div class="info-row">
                <span class="info-label">文件类型:</span>
                <span class="info-value" id="fileTypeInfo">(无)</span>
            </div>
            <div class="info-row">
                <span class="info-label">编码:</span>
                <span class="info-value" id="encodingInfo">UTF-8</span>
            </div>
            <div class="info-row">
                <span class="info-label">光标位置:</span>
                <span class="info-value" id="cursorInfo">行 1, 列 1</span>
            </div>
            <div class="info-row">
                <span class="info-label">保存状态:</span>
                <span class="info-value" id="saveStatusInfo">none</span>
            </div>
        </div>

        <!-- File Operations -->
        <div class="debug-section">
            <h2>文件操作</h2>
            <div class="control-group">
                <button class="control-btn primary" id="openAgent">打开 AGENT.md</button>
                <button class="control-btn primary" id="openCheckout">打开 checkout.md</button>
                <button class="control-btn primary" id="openScript">打开 utils.js</button>
            </div>
        </div>

        <!-- Cursor Operations -->
        <div class="debug-section">
            <h2>光标操作</h2>
            <div class="control-group">
                <button class="control-btn" id="lineUp">行 -1</button>
                <button class="control-btn" id="lineDown">行 +1</button>
                <button class="control-btn" id="colLeft">列 -1</button>
                <button class="control-btn" id="colRight">列 +1</button>
            </div>
        </div>

        <!-- Dirty State -->
        <div class="debug-section">
            <h2>保存状态</h2>
            <div class="control-group">
                <button class="control-btn" id="markUnsaved">标记未保存</button>
                <button class="control-btn primary" id="markSaved">标记已保存</button>
            </div>
        </div>

        <!-- Reset -->
        <div class="debug-section">
            <div class="control-group">
                <button class="control-btn danger" id="resetBtn">清空状态</button>
                <button class="control-btn" id="clearLog">Clear Log</button>
            </div>
        </div>

        <!-- Event Log -->
        <div class="debug-section">
            <h2>事件日志</h2>
            <div class="event-log" id="eventLog">
                <div class="event-log-empty">暂无事件</div>
            </div>
        </div>
    </div>

    <!-- Preview Area -->
    <div class="preview-area">
        <div class="preview-label">组件预览</div>
        <div class="preview-container" id="previewContainer" theme="dark">
            <!-- Status Bar will be inserted here -->
        </div>
    </div>

    <script type="module">
        // Import component
        import '../src/components/status-bar/rtc-status-bar.ts';
        import {StatusBarController} from '../src/controllers/status-bar.controller.ts';
        import {EditorAreaController} from '../src/controllers/editor-area.controller.ts';

        // ── Mock Data ──
        const MOCK_FILES = {
            '/AGENT.md': `# RTC Agent

Your AI-powered assistant.

## Available Tools

- \`ls\`: List directory contents
- \`read\`: Read file contents
- \`write\`: Write or create files
`,
            '/scenarios/checkout.md': `# 结账流程

## 用户故事

作为用户，我希望能够快速完成结账，以便尽快收到商品。

## 流程步骤

1. 确认购物车商品
2. 选择收货地址
3. 选择支付方式
`,
            '/scripts/utils.js': `// Utility functions

/**
 * Format date to locale string
 */
function formatDate(date) {
  return new Intl.DateTimeFormat('zh-CN').format(date);
}

export { formatDate };
`,
        };

        // ── DOM refs ──
        const previewContainer = document.getElementById('previewContainer');
        const stateDisplay = document.getElementById('stateDisplay');
        const eventLog = document.getElementById('eventLog');
        const currentThemeEl = document.getElementById('currentTheme');
        const fileTypeInfo = document.getElementById('fileTypeInfo');
        const encodingInfo = document.getElementById('encodingInfo');
        const cursorInfo = document.getElementById('cursorInfo');
        const saveStatusInfo = document.getElementById('saveStatusInfo');

        // ── Theme state ──
        let currentTheme = 'dark';

        // ── Create status bar component ──
        const statusBar = document.createElement('rtc-status-bar');
        statusBar.setAttribute('theme', 'dark');
        previewContainer.appendChild(statusBar);

        // ── Create fake hosts for controllers ──
        const fakeEditorHost = {
            addController() {},
            requestUpdate() {
                syncComponent();
            },
        };

        const fakeStatusHost = {
            addController() {},
            requestUpdate() {
                syncComponent();
            },
        };

        const editorController = new EditorAreaController(fakeEditorHost);
        const statusBarController = new StatusBarController(fakeStatusHost, editorController);

        // ── Sync controller state → component ──
        function syncComponent() {
            const info = statusBarController.info;
            statusBar.fileInfo = info;
            statusBar.setAttribute('theme', currentTheme);

            // Update state display
            stateDisplay.textContent = JSON.stringify(info, null, 2);

            // Update info panel
            fileTypeInfo.textContent = info.fileType || '(无)';
            encodingInfo.textContent = info.encoding;
            cursorInfo.textContent = `行 ${info.cursor.line}, 列 ${info.cursor.column}`;
            saveStatusInfo.textContent = info.saveStatus;
        }

        // ── Event logging ──
        function logEvent(name, detail) {
            const entry = document.createElement('div');
            entry.className = 'event-log-entry';
            const time = new Date().toLocaleTimeString();
            const detailStr = detail && Object.keys(detail).length > 0
                ? JSON.stringify(detail)
                : '';
            entry.innerHTML =
                `<span class="event-time">${time}</span>` +
                `<span class="event-name">${name}</span> ` +
                `<span class="event-detail">${detailStr}</span>`;

            // Remove empty placeholder
            const empty = eventLog.querySelector('.event-log-empty');
            if (empty) empty.remove();

            // Add to top
            eventLog.insertBefore(entry, eventLog.firstChild);

            // Keep only last 30 entries
            while (eventLog.children.length > 30) {
                eventLog.removeChild(eventLog.lastChild);
            }
        }

        // ── Theme buttons ──
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                currentTheme = theme;

                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThemeEl.textContent = theme;

                previewContainer.setAttribute('theme', theme);
                syncComponent();
                logEvent('theme-change', {theme});
            });
        });

        // ── File operation buttons ──
        document.getElementById('openAgent').addEventListener('click', () => {
            editorController.actions.openFile('/AGENT.md', MOCK_FILES['/AGENT.md']);
            editorController.actions.setCursorPosition('/AGENT.md', {line: 1, column: 1});
            syncComponent();
            logEvent('open-file', {filePath: '/AGENT.md'});
        });

        document.getElementById('openCheckout').addEventListener('click', () => {
            editorController.actions.openFile('/scenarios/checkout.md', MOCK_FILES['/scenarios/checkout.md']);
            editorController.actions.setCursorPosition('/scenarios/checkout.md', {line: 1, column: 1});
            syncComponent();
            logEvent('open-file', {filePath: '/scenarios/checkout.md'});
        });

        document.getElementById('openScript').addEventListener('click', () => {
            editorController.actions.openFile('/scripts/utils.js', MOCK_FILES['/scripts/utils.js']);
            editorController.actions.setCursorPosition('/scripts/utils.js', {line: 1, column: 1});
            syncComponent();
            logEvent('open-file', {filePath: '/scripts/utils.js'});
        });

        // ── Cursor operation buttons ──
        document.getElementById('lineUp').addEventListener('click', () => {
            const activeTab = editorController.activeTab;
            if (activeTab) {
                const newLine = Math.max(1, activeTab.cursorPosition.line - 1);
                editorController.actions.setCursorPosition(activeTab.filePath, {
                    ...activeTab.cursorPosition,
                    line: newLine,
                });
                syncComponent();
                logEvent('cursor-move', {line: newLine, column: activeTab.cursorPosition.column});
            }
        });

        document.getElementById('lineDown').addEventListener('click', () => {
            const activeTab = editorController.activeTab;
            if (activeTab) {
                const newLine = activeTab.cursorPosition.line + 1;
                editorController.actions.setCursorPosition(activeTab.filePath, {
                    ...activeTab.cursorPosition,
                    line: newLine,
                });
                syncComponent();
                logEvent('cursor-move', {line: newLine, column: activeTab.cursorPosition.column});
            }
        });

        document.getElementById('colLeft').addEventListener('click', () => {
            const activeTab = editorController.activeTab;
            if (activeTab) {
                const newCol = Math.max(1, activeTab.cursorPosition.column - 1);
                editorController.actions.setCursorPosition(activeTab.filePath, {
                    ...activeTab.cursorPosition,
                    column: newCol,
                });
                syncComponent();
                logEvent('cursor-move', {line: activeTab.cursorPosition.line, column: newCol});
            }
        });

        document.getElementById('colRight').addEventListener('click', () => {
            const activeTab = editorController.activeTab;
            if (activeTab) {
                const newCol = activeTab.cursorPosition.column + 1;
                editorController.actions.setCursorPosition(activeTab.filePath, {
                    ...activeTab.cursorPosition,
                    column: newCol,
                });
                syncComponent();
                logEvent('cursor-move', {line: activeTab.cursorPosition.line, column: newCol});
            }
        });

        // ── Dirty state buttons ──
        document.getElementById('markUnsaved').addEventListener('click', () => {
            const activeTab = editorController.activeTab;
            if (activeTab) {
                // Simulate content change to mark dirty
                editorController.actions.updateContent(activeTab.filePath, activeTab.content + '\n');
                syncComponent();
                logEvent('mark-unsaved', {filePath: activeTab.filePath});
            }
        });

        document.getElementById('markSaved').addEventListener('click', () => {
            const activeTab = editorController.activeTab;
            if (activeTab) {
                editorController.actions.saveFile(activeTab.filePath);
                syncComponent();
                logEvent('mark-saved', {filePath: activeTab.filePath});
            }
        });

        // ── Reset / Clear ──
        document.getElementById('resetBtn').addEventListener('click', () => {
            editorController.actions.closeAll();
            currentTheme = 'dark';
            document.querySelectorAll('.theme-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.theme === 'dark');
            });
            currentThemeEl.textContent = 'dark';
            previewContainer.setAttribute('theme', 'dark');
            syncComponent();
            logEvent('reset', {});
        });

        document.getElementById('clearLog').addEventListener('click', () => {
            eventLog.innerHTML = '<div class="event-log-empty">暂无事件</div>';
        });

        // ── Initial state ──
        syncComponent();
    </script>
</body>
</html>
